<!doctype html><meta charset="utf-8"><title>bridge probe</title>
<body><pre id="log"></pre><script>
// Reproduces what the A2UI Composer does to a renderer application: a sandboxed
// iframe plus the documented ?origin= pairing contract, then the five-message
// protocol. Nothing here is Gather-specific except the composition it renders.
const out = [];
const say = (m) => { out.push(m); document.getElementById('log').textContent = out.join('\n'); };
const R = { ready: false, catalog: null, actions: [], log: out };
window.__result = R;

const params = new URLSearchParams(location.search);
const renderer = params.get('renderer');
const rendererOrigin = new URL(renderer).origin;

const frame = document.createElement('iframe');
frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
frame.src = renderer + '?origin=' + encodeURIComponent(location.origin);
frame.style.cssText = 'width:460px;height:860px;border:1px solid #ccc';
const send = (m) => { frame.contentWindow.postMessage(m, rendererOrigin); say('-> ' + m.type); };
window.__send = send;

window.addEventListener('message', (event) => {
  if (event.source !== frame.contentWindow) return;
  const message = event.data;
  if (!message || typeof message !== 'object') return;
  say('<- ' + message.type + (message.type === 'SEND_TO_SERVER' ? ' ' + (message.payload?.action?.name ?? '') : ''));
  if (message.type === 'RENDERER_READY') { R.ready = true; send({ type: 'GET_CATALOG' }); }
  if (message.type === 'A2UI_CATALOG') R.catalog = message.payload;
  if (message.type === 'SEND_TO_SERVER') R.actions.push(message.payload);
});

say('embedding ' + frame.src);
document.body.appendChild(frame);
</script></body>
